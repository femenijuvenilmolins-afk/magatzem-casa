name: Prova autonoma ofertes - nomes lectura
on:
  workflow_dispatch:
  schedule:
    - cron: '37 8 * * *'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar regles de seguretat
        run: python -m unittest discover -s tests/offer_probe -p 'test_*.py' -v
      - name: Consultar API publica de fullets - prova sense avisos
        run: python tests/offer_probe/probe.py

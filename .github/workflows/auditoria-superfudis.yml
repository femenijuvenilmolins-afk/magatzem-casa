name: Auditoria Puppeteer Bonpreu
on:
  push:
    branches: [auditoria-superfudis]
    paths: ['.github/workflows/auditoria-superfudis.yml']
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save puppeteer
      - run: |
          node --input-type=module <<'JS'
          import puppeteer from 'puppeteer';
          import fs from 'node:fs';
          const out={timestamp:new Date().toISOString(),blocked:[],purpose:'Single ordinary homepage diagnostic; no retries or further navigation'};
          let browser;
          try {
            browser=await puppeteer.launch({headless:true,args:['--no-sandbox']});
            const page=await browser.newPage();
            page.on('response',r=>{
              if([401,403,429].includes(r.status())){
                const u=new URL(r.url());
                out.blocked.push({status:r.status(),url:u.origin+u.pathname,type:r.request().resourceType(),method:r.request().method()});
              }
            });
            const r=await page.goto('https://www.compraonline.bonpreuesclat.cat/',{waitUntil:'domcontentloaded',timeout:30000});
            out.status=r?.status();
            await new Promise(resolve=>setTimeout(resolve,5000));
            out.title=await page.title();
          } catch(e){out.error=String(e);}
          finally {if(browser) await browser.close();}
          fs.mkdirSync('auditoria',{recursive:true});
          fs.writeFileSync('auditoria/bonpreu-puppeteer.json',JSON.stringify(out,null,2));
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditoria/bonpreu-puppeteer.json
          git commit -m 'Diagnosi Puppeteer portada'
          git push origin HEAD:auditoria-superfudis

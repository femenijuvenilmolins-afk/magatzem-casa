name: Auditoria sitemap Bonpreu
on:
  push:
    branches: [auditoria-superfudis]
    paths: ['.github/workflows/auditoria-superfudis.yml']
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import urllib.request as u, urllib.robotparser as rp, json, datetime, re, time
          import xml.etree.ElementTree as ET
          from urllib.parse import quote
          base='https://www.compraonline.bonpreuesclat.cat'
          agent='MagatzemCasa-Audit/1.0'
          def read(url):
              with u.urlopen(u.Request(quote(url,safe=':/?&=%#'),headers={'User-Agent':agent}),timeout=15) as r:return r.read(8000000).decode(errors='replace')
          out={'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat(),'tests':{}}
          try:
              robots=rp.RobotFileParser()
              robots.parse(read(base+'/robots.txt').splitlines())
              for kind in ['products','promotions']:
                  url=base+'/sitemaps/sitemap-'+kind+'-part1.xml'
                  if not robots.can_fetch(agent,url):continue
                  try:
                      root=ET.fromstring(read(url))
                      urls=[x.text for x in root.iter() if x.tag.split('}')[-1]=='loc' and x.text]
                      entry={'count':len(urls),'samples':[]}
                      out['tests'][kind]=entry
                      for link in urls[:3]:
                          if not link.startswith(base+'/') or not robots.can_fetch(agent,link):continue
                          body=read(link)
                          scripts=re.findall(r'<script[^>]*type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',body,re.S)
                          entry['samples'].append({'url':link,'bytes':len(body),'structured':scripts[:3],'price_mentions':re.findall(r'.{0,35}\d+[,.]\d{2}\s*(?:€|&euro;).{0,35}',body)[:8]})
                          time.sleep(1)
                  except Exception as e:
                      out['tests'][kind]={'error':str(e)}
                      if '403' in str(e) or '429' in str(e):break
          except Exception as e:out['error']=str(e)
          with open('auditoria/bonpreu-sitemap.json','w') as f:json.dump(out,f,ensure_ascii=False,indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditoria/bonpreu-sitemap.json
          git commit -m 'Resultat mostra sitemap'
          git push origin HEAD:auditoria-superfudis

name: Diagnosi resposta HTTP Bonpreu
on:
  push:
    branches: [auditoria-superfudis]
    paths: ['.github/workflows/auditoria-superfudis.yml']
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import urllib.request, urllib.error, urllib.robotparser, json, datetime, re
          from pathlib import Path
          base='https://www.compraonline.bonpreuesclat.cat'
          ua='MagatzemCasa-Audit/1.0'
          out={'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          try:
              with urllib.request.urlopen('https://api.ipify.org?format=json',timeout=10) as r:
                  ip=json.load(r)['ip']
              out['runner_network_prefix']='.'.join(ip.split('.')[:3])+'.0/24' if '.' in ip else 'IPv6'
          except Exception as e: out['network_error']=str(e)
          try:
              with urllib.request.urlopen(urllib.request.Request(base+'/robots.txt',headers={'User-Agent':ua}),timeout=20) as r: robots=r.read().decode()
              rp=urllib.robotparser.RobotFileParser(); rp.parse(robots.splitlines())
              url=base+'/categories'
              out['robots_allowed']=rp.can_fetch(ua,url)
              if out['robots_allowed']:
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':ua}),timeout=20) as r: out['status']=r.status
                  except urllib.error.HTTPError as e:
                      out['status']=e.code
                      allowed={'server','via','content-type','x-cache','x-amzn-waf-action','x-amz-cf-pop','retry-after','cf-mitigated'}
                      out['headers']={k:v for k,v in e.headers.items() if k.lower() in allowed}
                      body=e.read(8192).decode('utf-8','replace')
                      out['body_indicators']={s:s.lower() in body.lower() for s in ['AWS WAF','CloudFront','Access Denied','Forbidden','Request blocked','captcha','challenge']}
                      out['body_title']=re.findall(r'<title[^>]*>([^<]{1,150})</title>',body,re.I)
          except Exception as e: out['error']=str(e)
          Path('auditoria').mkdir(exist_ok=True)
          Path('auditoria/bonpreu-network-diagnostic.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditoria/bonpreu-network-diagnostic.json
          git commit -m 'Diagnosi resposta HTTP sense reintents'
          git push origin HEAD:auditoria-superfudis

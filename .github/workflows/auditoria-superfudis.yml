name: Prova única de la categoria de bacallà de Bonpreu
on:
  push:
    branches: [auditoria-superfudis]
    paths: ['.github/workflows/auditoria-superfudis.yml']
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Llegir la categoria pública de bacallà sense reintents
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          class ProductCards(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.depth = 0
                  self.products = {}

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'div':
                      if self.depth:
                          self.depth += 1
                      elif 'product-card-container' in attrs.get('class', '').split():
                          self.depth = 1
                          self.sku = None
                          self.name = None
                          self.values = []

                  if self.depth and tag == 'a':
                      match = re.fullmatch(r'/products/[^/]+/(\d+)', attrs.get('href', ''))
                      if match:
                          self.sku = match[1]
                          self.name = attrs.get('aria-label') or self.name

              def handle_data(self, data):
                  if self.depth and data.strip():
                      self.values.append(data.strip())

              def handle_endtag(self, tag):
                  if tag != 'div' or not self.depth:
                      return
                  self.depth -= 1
                  if self.depth or not self.sku or 'Preu' not in self.values:
                      return
                  price_index = self.values.index('Preu') + 1
                  if price_index >= len(self.values):
                      return
                  price = self.values[price_index]
                  if not re.fullmatch(r'\d+[,.]\d{2}\s*€', price):
                      return
                  unit = next((i for i, v in enumerate(self.values) if v.startswith('(') and '€' in v), None)
                  promotion = next((v for v in self.values if v.startswith('Nom de l’oferta:')), None)
                  self.products[self.sku] = {
                      'sku': self.sku,
                      'name': self.name or next((v for v in self.values if self.values.count(v) > 1), None),
                      'format': self.values[unit - 1] if unit else None,
                      'price': price,
                      'promotion': promotion,
                  }

          url = 'https://www.compraonline.bonpreuesclat.cat/categories/congelats/peixos-i-mariscos/peixos/bacall%C3%A0/d7775ea7-0d09-4514-b142-e6a997fa2a6a'
          result = {'url': url, 'method': 'GET', 'commit': os.environ['GITHUB_SHA']}
          try:
              request = urllib.request.Request(url, headers={'User-Agent': 'MagatzemCasa-Audit/1.0'})
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=20) as response:
                  result['status'] = response.status
                  result['content_type'] = response.headers.get('Content-Type')
                  page = ProductCards()
                  page.feed(response.read(5_000_000).decode('utf-8', errors='replace'))
                  result['products_with_price'] = len(page.products)
                  result['sample'] = list(page.products.values())[:3]
          except urllib.error.HTTPError as error:
              result['status'] = error.code
              result['error'] = str(error)
          except (urllib.error.URLError, ValueError, AttributeError, TimeoutError) as error:
              result['error'] = str(error)
          output = json.dumps(result, ensure_ascii=False, indent=2)
          print(output)
          Path('auditoria/bonpreu-cod-category-actions.json').write_text(output + '\n')
          PY
      - name: Desar l’evidència
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditoria/bonpreu-cod-category-actions.json
          git commit -m 'Resultat de la categoria de bacallà de Bonpreu a GitHub Actions'
          git push origin HEAD:auditoria-superfudis

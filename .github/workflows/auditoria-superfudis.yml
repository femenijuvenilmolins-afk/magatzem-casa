name: Auditoria geografia
on:
  push:
    branches: [auditoria-superfudis]
    paths: ['.github/workflows/auditoria-superfudis.yml']
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import urllib.request as u,json,datetime
          def get(url,data=None):
              try:
                  req=u.Request(url,data=json.dumps(data).encode() if data is not None else None,headers={'Content-Type':'application/json','User-Agent':'MagatzemCasa-Audit/1.0'})
                  with u.urlopen(req,timeout=15) as r: return {'status':r.status,'data':json.load(r)}
              except Exception as e: return {'error':str(e)}
          base='https://tienda.mercadona.es/api/'
          out={'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat(),'tests':{},'note':'Exploratory parameters; HTTP success does not prove geographic filtering.'}
          for cp in ['08830','28001']:
              out['tests']['postal_'+cp]=get(base+'postal-codes/'+cp+'/')
              for sku in ['14271','42314']:
                  out['tests'][cp+'_'+sku]=get(base+'products/'+sku+'/?postal_code='+cp)
          out['tests']['invalid_postal']=get(base+'postal-codes/00000/')
          out['tests']['superfudis_schema']=get('https://supercomparador-i9tw.onrender.com/openapi.json')
          with open('auditoria/geografia.json','w') as f: json.dump(out,f,ensure_ascii=False,indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditoria/geografia.json
          git commit -m 'Evidencia exploratoria geografia'
          git push origin HEAD:auditoria-superfudis

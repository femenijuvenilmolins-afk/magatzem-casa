name: Auditoria entorn HTTP controlat
on:
  push:
    branches: [auditoria-superfudis]
    paths: ['.github/workflows/auditoria-superfudis.yml']
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import platform, ssl, subprocess, json, datetime, threading
          from http.server import HTTPServer, BaseHTTPRequestHandler
          from pathlib import Path
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  body=json.dumps({'protocol':self.request_version,'user_agent':self.headers.get('User-Agent')}).encode()
                  self.send_response(200); self.send_header('Content-Length',str(len(body))); self.end_headers(); self.wfile.write(body)
          server=HTTPServer(('127.0.0.1',0),Handler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          def run(args):
              p=subprocess.run(args,capture_output=True,text=True,timeout=20)
              return {'exit':p.returncode,'stdout':p.stdout.strip(),'stderr':p.stderr.strip()}
          out={'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat(),'os':platform.platform(),'python':platform.python_version(),'openssl':ssl.OPENSSL_VERSION,'curl':run(['curl','--version']),'browsers':{b:run(['bash','-c','command -v '+b+' && '+b+' --version']) for b in ['google-chrome','chromium','firefox','microsoft-edge']},'local_http':run(['curl','--http1.1','-sS','http://127.0.0.1:'+str(server.server_port)])}
          server.shutdown()
          Path('auditoria').mkdir(exist_ok=True)
          Path('auditoria/entorn-controlat.json').write_text(json.dumps(out,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditoria/entorn-controlat.json
          git commit -m 'Registre entorn controlat local'
          git push origin HEAD:auditoria-superfudis

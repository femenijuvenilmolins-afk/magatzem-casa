name: Prova única de fitxa pública Bonpreu
on:
  push:
    branches: [auditoria-superfudis]
    paths: ['.github/workflows/auditoria-superfudis.yml']
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Llegir una fitxa pública sense reintents
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          class ProductData(HTMLParser):
              captures = False

              def __init__(self):
                  super().__init__()
                  self.products = []

              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      self.captures = dict(attrs).get('type') == 'application/ld+json'

              def handle_endtag(self, tag):
                  if tag == 'script':
                      self.captures = False

              def handle_data(self, data):
                  if self.captures:
                      value = json.loads(data)
                      if isinstance(value, dict) and value.get('@type') == 'Product':
                          self.products.append(value)

          url = 'https://www.compraonline.bonpreuesclat.cat/products/tachan-cami%C3%B3-xl-portacotxes/27247'
          result = {'url': url, 'method': 'GET', 'commit': os.environ['GITHUB_SHA']}
          try:
              request = urllib.request.Request(url, headers={'User-Agent': 'MagatzemCasa-Audit/1.0'})
              with urllib.request.build_opener(NoRedirect()).open(request, timeout=20) as response:
                  result['status'] = response.status
                  result['content_type'] = response.headers.get('Content-Type')
                  page = ProductData()
                  page.feed(response.read().decode('utf-8', errors='replace'))
                  if page.products:
                      product = page.products[0]
                      offer = product.get('offers') or {}
                      result['product'] = {'sku': product.get('sku'), 'price': offer.get('price'),
                                           'currency': offer.get('priceCurrency'),
                                           'availability': offer.get('availability')}
          except urllib.error.HTTPError as error:
              result['status'] = error.code
              result['error'] = str(error)
          except (urllib.error.URLError, ValueError, AttributeError, TimeoutError) as error:
              result['error'] = str(error)
          output = json.dumps(result, ensure_ascii=False, indent=2)
          print(output)
          Path('auditoria/bonpreu-public-product-actions.json').write_text(output + '\n')
          PY
      - name: Desar l’evidència
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditoria/bonpreu-public-product-actions.json
          git commit -m 'Resultat de la fitxa pública Bonpreu a GitHub Actions'
          git push origin HEAD:auditoria-superfudis

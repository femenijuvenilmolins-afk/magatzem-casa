name: Auditoria Superfudis
on:
  push:
    branches: [auditoria-superfudis]
    paths: ['.github/workflows/auditoria-superfudis.yml']
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Consultes i contrast
        run: |
          mkdir -p auditoria
          python - <<'PY'
          import json, urllib.request, urllib.error, datetime
          names=['Detergente Marsella Bosque Verde','Abrillantador lavavajillas Bosque Verde','Papel higiénico Bosque Verde','Vinagre limpieza Bosque Verde','Antical Bosque Verde','Pastillas lavavajillas Bosque Verde','Jabón manos Deliplus','Pasta dientes Deliplus','Limpiador WC Bosque Verde','Suavizante ropa Bosque Verde']
          def get(url, data=None):
              try:
                  req=urllib.request.Request(url,data=json.dumps(data).encode() if data else None,headers={'Content-Type':'application/json','User-Agent':'MagatzemCasa-Audit/1.0'})
                  with urllib.request.urlopen(req,timeout=20) as r: return json.load(r)
              except Exception as e: return {'error':str(e)}
          result=get('https://supercomparador-i9tw.onrender.com/api/v1/compare-basket',{'items':[{'query':n,'quantity':1} for n in names],'retailers':['Mercadona'],'include_delivery':False})
          official=[]
          for item in result.get('items',[]):
              for offer in item.get('offers',[]):
                  url=offer.get('source_url','')
                  if url.startswith('https://tienda.mercadona.es/product/'):
                      sku=url.split('/')[-1]
                      d=get('https://tienda.mercadona.es/api/products/'+sku+'/')
                      official.append({'sku':sku,'query':item['query'],'superfudis_price':offer.get('price_eur'),'official':{k:d.get(k) for k in ['id','display_name','price_instructions','unavailable','error']}})
          with open('auditoria/contrast.json','w') as f: json.dump({'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sample':'generic search terms, not verified inventory SKUs','superfudis':result,'official':official},f,ensure_ascii=False,indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditoria/contrast.json
          git commit -m 'Resultat contrast de deu productes'
          git push origin HEAD:auditoria-superfudis

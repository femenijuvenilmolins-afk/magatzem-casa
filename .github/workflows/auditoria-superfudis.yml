name: Auditoria Bonpreu
on:
  push:
    branches: [auditoria-superfudis]
    paths: ['.github/workflows/auditoria-superfudis.yml']
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import urllib.request as u, json, datetime, urllib.parse
          base='https://www.compraonline.bonpreuesclat.cat'
          out={'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat(),'tests':{}}
          for name,path in [('robots','/robots.txt'),('categories','/api/webproductpagews/v1/categories?categoryDepth=2'),('search','/api/webproductpagews/v6/product-pages/search?q='+urllib.parse.quote('detergent'))]:
              try:
                  with u.urlopen(u.Request(base+path,headers={'User-Agent':'MagatzemCasa-Audit/1.0','Accept':'application/json, text/plain'}),timeout=15) as r:
                      raw=r.read(500000)
                      try: data=json.loads(raw)
                      except Exception: data=raw.decode(errors='replace')[:10000]
                      out['tests'][name]={'status':r.status,'data':data}
              except Exception as e:
                  out['tests'][name]={'error':str(e)}
                  if '403' in str(e) or '429' in str(e):break
          with open('auditoria/bonpreu.json','w') as f:json.dump(out,f,ensure_ascii=False,indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditoria/bonpreu.json
          git commit -m 'Evidencia consulta Bonpreu'
          git push origin HEAD:auditoria-superfudis

name: Auditoria HTML public Bonpreu
on:
  push:
    branches: [auditoria-superfudis]
    paths: ['.github/workflows/auditoria-superfudis.yml']
permissions:
  contents: write
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import urllib.request, urllib.robotparser, json, datetime, re
          from html.parser import HTMLParser
          from pathlib import Path
          base='https://www.compraonline.bonpreuesclat.cat'
          url=base+'/categories'
          ua='MagatzemCasa-Audit/1.0'
          out={'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat(),'url':url}
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.parts=[]; self.skip=0
              def handle_starttag(self,tag,attrs):
                  if tag in ('script','style'): self.skip+=1
              def handle_endtag(self,tag):
                  if tag in ('script','style') and self.skip: self.skip-=1
              def handle_data(self,data):
                  if not self.skip and data.strip(): self.parts.append(data.strip())
          try:
              req=urllib.request.Request(base+'/robots.txt',headers={'User-Agent':ua})
              with urllib.request.urlopen(req,timeout=20) as r: robots=r.read().decode()
              rp=urllib.robotparser.RobotFileParser(); rp.parse(robots.splitlines())
              out['robots_allowed']=rp.can_fetch(ua,url)
              if out['robots_allowed']:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':ua}),timeout=30) as r:
                      out['status']=r.status; raw=r.read().decode('utf-8','replace')
                  parser=Parser(); parser.feed(raw)
                  visible='\n'.join(parser.parts)
                  out['html_bytes']=len(raw.encode())
                  out['price_matches']=len(re.findall(r'\d+[,.]\d{2}\s*€',visible))
                  out['visible_sample']=visible[:16000]
          except Exception as e:
              out['error']=str(e)
              out['status']=getattr(e,'code',None)
          Path('auditoria').mkdir(exist_ok=True)
          Path('auditoria/bonpreu-html-public.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditoria/bonpreu-html-public.json
          git commit -m 'Resultat HTML public Bonpreu'
          git push origin HEAD:auditoria-superfudis
